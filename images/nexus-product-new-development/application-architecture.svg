<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RADARアプリケーションアーキテクチャ</title>
  <desc id="desc">利用者、Next.js、Spring Bootモジュラーモノリス、PostgreSQL、Google OIDC、設計履歴の関係</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#0f172a"/>
    </marker>
    <marker id="traceArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; fill:#0f172a; }
      .title { font-size:44px; font-weight:800; }
      .subtitle { font-size:20px; fill:#475569; }
      .layer { font-size:25px; font-weight:800; }
      .label { font-size:18px; font-weight:700; }
      .small { font-size:15px; fill:#475569; }
      .module { font-size:17px; font-weight:700; }
      .flow { font-size:16px; font-weight:700; fill:#334155; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <circle cx="1490" cy="50" r="190" fill="#dcfce7" opacity=".55"/>
  <circle cx="60" cy="870" r="180" fill="#dbeafe" opacity=".55"/>

  <text x="70" y="78" class="title">RADAR アプリケーションアーキテクチャ</text>
  <text x="70" y="115" class="subtitle">サーバー側へ認証と業務操作を寄せ、境界コンテキストを保ったモジュラーモノリス</text>

  <!-- users -->
  <g filter="url(#shadow)">
    <rect x="70" y="205" width="190" height="430" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="165" y="250" text-anchor="middle" class="layer">利用者</text>
    <circle cx="165" cy="315" r="32" fill="#dbeafe"/>
    <path d="M145 313a20 20 0 1 1 40 0M132 361c6-25 60-25 66 0" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <text x="165" y="399" text-anchor="middle" class="label">営業</text>
    <text x="165" y="449" text-anchor="middle" class="label">PM・リーダー</text>
    <text x="165" y="499" text-anchor="middle" class="label">調達</text>
    <rect x="95" y="548" width="140" height="40" rx="20" fill="#eff6ff"/>
    <text x="165" y="574" text-anchor="middle" class="small">ブラウザ</text>
  </g>

  <!-- frontend -->
  <g filter="url(#shadow)">
    <rect x="355" y="185" width="285" height="470" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="498" y="232" text-anchor="middle" class="layer" fill="#1d4ed8">Frontend</text>
    <text x="498" y="264" text-anchor="middle" class="small">Next.js App Router</text>
    <rect x="384" y="300" width="227" height="70" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
    <text x="498" y="342" text-anchor="middle" class="label">Server Components</text>
    <rect x="384" y="390" width="227" height="70" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
    <text x="498" y="432" text-anchor="middle" class="label">Server Actions</text>
    <rect x="384" y="480" width="227" height="70" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
    <text x="498" y="514" text-anchor="middle" class="label">apiFetch()</text>
    <text x="498" y="538" text-anchor="middle" class="small">Cookie中継 / no-store</text>
    <rect x="405" y="583" width="186" height="38" rx="19" fill="#dbeafe"/>
    <text x="498" y="608" text-anchor="middle" class="small" fill="#1d4ed8">ブラウザから直接接続しない</text>
  </g>

  <!-- backend -->
  <g filter="url(#shadow)">
    <rect x="745" y="165" width="520" height="510" rx="24" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <text x="1005" y="212" text-anchor="middle" class="layer" fill="#c2410c">Backend</text>
    <text x="1005" y="244" text-anchor="middle" class="small">Spring Boot モジュラーモノリス</text>

    <g>
      <rect x="780" y="280" width="210" height="58" rx="12" fill="#fff" stroke="#fdba74"/>
      <text x="885" y="315" text-anchor="middle" class="module">商談・アサイン</text>
      <rect x="1020" y="280" width="210" height="58" rx="12" fill="#fff" stroke="#fdba74"/>
      <text x="1125" y="315" text-anchor="middle" class="module">遅延リスク</text>
      <rect x="780" y="354" width="210" height="58" rx="12" fill="#fff" stroke="#fdba74"/>
      <text x="885" y="389" text-anchor="middle" class="module">メンバー</text>
      <rect x="1020" y="354" width="210" height="58" rx="12" fill="#fff" stroke="#fdba74"/>
      <text x="1125" y="389" text-anchor="middle" class="module">通知</text>
      <rect x="780" y="428" width="210" height="58" rx="12" fill="#fff" stroke="#fdba74"/>
      <text x="885" y="463" text-anchor="middle" class="module">認証・権限</text>
      <rect x="1020" y="428" width="210" height="58" rx="12" fill="#fff" stroke="#fdba74"/>
      <text x="1125" y="463" text-anchor="middle" class="module">予実</text>
      <rect x="780" y="502" width="450" height="58" rx="12" fill="#fff" stroke="#fdba74"/>
      <text x="1005" y="537" text-anchor="middle" class="module">調達</text>
      <rect x="780" y="590" width="450" height="52" rx="12" fill="#ffedd5" stroke="#fb923c"/>
      <text x="1005" y="623" text-anchor="middle" class="module" fill="#c2410c">横断：監査ログ</text>
      <path d="M885 560V585M1125 560V585M885 486V585M1125 486V585" stroke="#d97706" stroke-width="2" stroke-dasharray="5 5"/>
    </g>
  </g>

  <!-- database -->
  <g filter="url(#shadow)">
    <rect x="1360" y="205" width="175" height="430" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="1448" y="250" text-anchor="middle" class="layer" fill="#15803d">PostgreSQL</text>
    <ellipse cx="1448" cy="310" rx="57" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M1391 310v75c0 11 25 20 57 20s57-9 57-20v-75M1391 347c0 11 25 20 57 20s57-9 57-20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1448" y="453" text-anchor="middle" class="label">BCごとのスキーマ</text>
    <text x="1448" y="495" text-anchor="middle" class="label">Flyway</text>
    <text x="1448" y="537" text-anchor="middle" class="label">排他制約</text>
    <text x="1448" y="579" text-anchor="middle" class="small">履歴・監査</text>
  </g>

  <!-- runtime arrows -->
  <path d="M260 420H337" stroke="#0f172a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M327 412 342 420 327 428Z" fill="#0f172a"/>
  <rect x="270" y="379" width="61" height="27" rx="13" fill="#fff"/>
  <text x="301" y="398" text-anchor="middle" class="flow">HTTPS</text>
  <path d="M640 420H727" stroke="#0f172a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M717 412 732 420 717 428Z" fill="#0f172a"/>
  <text x="684" y="382" text-anchor="middle" class="flow">REST API</text>
  <text x="684" y="402" text-anchor="middle" class="small">+ Cookie</text>
  <path d="M1265 420H1342" stroke="#0f172a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1332 412 1347 420 1332 428Z" fill="#0f172a"/>
  <text x="1304" y="398" text-anchor="middle" class="flow">JPA / SQL</text>

  <!-- OIDC -->
  <g filter="url(#shadow)">
    <rect x="855" y="75" width="300" height="62" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="1005" y="114" text-anchor="middle" class="label">Google OIDC</text>
  </g>
  <path d="M1005 137V415" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <path d="M997 405 1005 420 1013 405Z" fill="#64748b"/>

  <!-- design history -->
  <g>
    <rect x="355" y="742" width="910" height="110" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="400" y="780" class="label" fill="#6d28d9">設計履歴</text>
    <rect x="400" y="798" width="240" height="36" rx="18" fill="#ede9fe"/>
    <text x="520" y="822" text-anchor="middle" class="small" fill="#6d28d9">Nexus Architect成果物</text>
    <rect x="660" y="798" width="210" height="36" rx="18" fill="#ede9fe"/>
    <text x="765" y="822" text-anchor="middle" class="small" fill="#6d28d9">traceability.json</text>
    <rect x="890" y="798" width="210" height="36" rx="18" fill="#ede9fe"/>
    <text x="995" y="822" text-anchor="middle" class="small" fill="#6d28d9">MVPアーカイブ</text>
    <path d="M498 742V675M1005 742V686" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#traceArrow)"/>
    <path d="M490 685 498 670 506 685Z" fill="#7c3aed"/>
    <path d="M997 696 1005 681 1013 696Z" fill="#7c3aed"/>
  </g>

  <g transform="translate(1310 760)">
    <line x1="0" y1="8" x2="45" y2="8" stroke="#0f172a" stroke-width="4"/>
    <text x="58" y="14" class="small">実行時通信</text>
    <line x1="0" y1="43" x2="45" y2="43" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="58" y="49" class="small">トレーサビリティ</text>
  </g>
</svg>
