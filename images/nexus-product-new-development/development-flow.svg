<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RADARの開発フロー</title>
  <desc id="desc">業務課題から価値仮説、MVP、本番設計、実装、実利用後の再設計へ進み、再び仮説へ戻る反復型の開発フロー</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#2563eb"/>
    </marker>
    <marker id="loopArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #0f172a; }
      .title { font-size: 46px; font-weight: 800; letter-spacing: .02em; }
      .subtitle { font-size: 21px; fill: #475569; }
      .step { font-size: 18px; font-weight: 700; fill: #2563eb; }
      .card-title { font-size: 27px; font-weight: 800; }
      .body { font-size: 18px; fill: #475569; }
      .chip { font-size: 15px; font-weight: 700; }
      .legend { font-size: 16px; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <circle cx="1470" cy="74" r="190" fill="#dbeafe" opacity=".6"/>
  <circle cx="88" cy="850" r="210" fill="#ede9fe" opacity=".55"/>

  <text x="72" y="86" class="title">RADARの開発フロー</text>
  <text x="72" y="125" class="subtitle">AIが候補を広げ、人間が節目で判断し、その決定を次の成果物へ渡す</text>

  <!-- top row -->
  <g filter="url(#shadow)">
    <rect x="72" y="190" width="410" height="220" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="72" y="190" width="410" height="8" rx="4" fill="#dc2626"/>
    <circle cx="120" cy="240" r="25" fill="#fee2e2"/>
    <text x="120" y="247" text-anchor="middle" class="step" fill="#dc2626">1</text>
    <text x="160" y="248" class="card-title">業務課題</text>
    <text x="104" y="306" class="body">スプレッドシートに集まった</text>
    <text x="104" y="336" class="body">状態・権限・同時実行・監査を可視化</text>
    <rect x="104" y="365" width="128" height="28" rx="14" fill="#fee2e2"/>
    <text x="168" y="385" text-anchor="middle" class="chip" fill="#b91c1c">人間が観察</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="595" y="190" width="410" height="220" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="595" y="190" width="410" height="8" rx="4" fill="#2563eb"/>
    <circle cx="643" cy="240" r="25" fill="#dbeafe"/>
    <text x="643" y="247" text-anchor="middle" class="step">2</text>
    <text x="683" y="248" class="card-title">価値仮説とスコープ</text>
    <text x="627" y="306" class="body">Vision・成功指標・ペルソナ・機能候補を</text>
    <text x="627" y="336" class="body">壁打ちし、最初に改善する判断を絞る</text>
    <rect x="627" y="365" width="102" height="28" rx="14" fill="#dbeafe"/>
    <text x="678" y="385" text-anchor="middle" class="chip" fill="#1d4ed8">AIが提案</text>
    <rect x="739" y="365" width="128" height="28" rx="14" fill="#e0e7ff"/>
    <text x="803" y="385" text-anchor="middle" class="chip" fill="#4338ca">人間が決定</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1118" y="190" width="410" height="220" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1118" y="190" width="410" height="8" rx="4" fill="#d97706"/>
    <circle cx="1166" cy="240" r="25" fill="#ffedd5"/>
    <text x="1166" y="247" text-anchor="middle" class="step" fill="#c2410c">3</text>
    <text x="1206" y="248" class="card-title">MVPによる検証</text>
    <text x="1150" y="306" class="body">コンシェルジュMVPを実運用へ持ち込み</text>
    <text x="1150" y="336" class="body">仮アサインの価値と業務適合性を確認</text>
    <rect x="1150" y="365" width="149" height="28" rx="14" fill="#ffedd5"/>
    <text x="1225" y="385" text-anchor="middle" class="chip" fill="#c2410c">小さく作って検証</text>
  </g>

  <path d="M492 300H575" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M565 292 580 300 565 308Z" fill="#2563eb"/>
  <path d="M1015 300H1098" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1088 292 1103 300 1088 308Z" fill="#2563eb"/>

  <!-- bottom row -->
  <g filter="url(#shadow)">
    <rect x="72" y="535" width="410" height="220" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="72" y="535" width="410" height="8" rx="4" fill="#7c3aed"/>
    <circle cx="120" cy="585" r="25" fill="#ede9fe"/>
    <text x="120" y="592" text-anchor="middle" class="step" fill="#7c3aed">4</text>
    <text x="160" y="593" class="card-title">本番設計とレビュー</text>
    <text x="104" y="651" class="body">境界コンテキスト・API・データ設計を</text>
    <text x="104" y="681" class="body">5観点でレビューし、P0/P1を解消</text>
    <rect x="104" y="710" width="174" height="28" rx="14" fill="#ede9fe"/>
    <text x="191" y="730" text-anchor="middle" class="chip" fill="#6d28d9">Product → Architect</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="595" y="535" width="410" height="220" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="595" y="535" width="410" height="8" rx="4" fill="#16a34a"/>
    <circle cx="643" cy="585" r="25" fill="#dcfce7"/>
    <text x="643" y="592" text-anchor="middle" class="step" fill="#15803d">5</text>
    <text x="683" y="593" class="card-title">実装とテスト</text>
    <text x="627" y="651" class="body">Next.js・Spring Boot・PostgreSQLで</text>
    <text x="627" y="681" class="body">業務ルール、認可、監査、排他制約を実装</text>
    <rect x="627" y="710" width="164" height="28" rx="14" fill="#dcfce7"/>
    <text x="709" y="730" text-anchor="middle" class="chip" fill="#15803d">コードで検証可能に</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1118" y="535" width="410" height="220" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1118" y="535" width="410" height="8" rx="4" fill="#0891b2"/>
    <circle cx="1166" cy="585" r="25" fill="#cffafe"/>
    <text x="1166" y="592" text-anchor="middle" class="step" fill="#0e7490">6</text>
    <text x="1206" y="593" class="card-title">実利用から再設計</text>
    <text x="1150" y="651" class="body">予実・営業依頼・調達など、運用で見えた</text>
    <text x="1150" y="681" class="body">業務を既存の境界へ反映する</text>
    <rect x="1150" y="710" width="154" height="28" rx="14" fill="#cffafe"/>
    <text x="1227" y="730" text-anchor="middle" class="chip" fill="#0e7490">学びを次の仮説へ</text>
  </g>

  <path d="M1098 455H502C480 455 470 466 470 488V514" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M462 504 470 519 478 504Z" fill="#2563eb"/>
  <path d="M492 645H575" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M565 637 580 645 565 653Z" fill="#2563eb"/>
  <path d="M1015 645H1098" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1088 637 1103 645 1088 653Z" fill="#2563eb"/>

  <path d="M1528 645H1562V158H800V174" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#loopArrow)"/>
  <path d="M792 164 800 179 808 164Z" fill="#7c3aed"/>
  <rect x="1275" y="115" width="238" height="42" rx="21" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1394" y="142" text-anchor="middle" class="chip" fill="#6d28d9">運用の学びで仮説を更新</text>

  <g transform="translate(72 817)">
    <circle cx="10" cy="10" r="9" fill="#2563eb"/>
    <text x="30" y="16" class="legend">実線：成果物と判断を次工程へ渡す</text>
    <line x1="365" y1="10" x2="425" y2="10" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="445" y="16" class="legend">破線：実利用の学びを仮説へ戻す</text>
  </g>
</svg>
